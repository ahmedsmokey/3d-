    <script>
      (function() {
        try {
          var saved = localStorage.getItem('printforge_theme');
          var theme = (saved === 'light' || saved === 'dark') ? saved : 'light';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.style.colorScheme = theme;
        } catch(e) {}
      })();
    </script>
